<section id="markdown-panel" class="tool-panel">
  <div class="tool-header">
    <div class="tool-breadcrumb" onclick="openDashboard()">
      <i class="ph ph-squares-four"></i> <span data-i18n="breadcrumb_tools">Araçlar</span>
      <i class="ph ph-caret-right"></i> <span data-i18n="md_breadcrumb">Geliştirici</span>
    </div>
    <h2 data-i18n="md_title">Markdown ↔ HTML Dönüştürücü</h2>
  </div>

  <div class="md-tabs">
    <button id="md-tab-md2html" class="md-tab active">
      <i class="ph ph-markdown-logo"></i> <span data-i18n="md_tab_md2html">Markdown → HTML</span>
    </button>
    <button id="md-tab-html2md" class="md-tab">
      <i class="ph ph-code"></i> <span data-i18n="md_tab_html2md">HTML → Markdown</span>
    </button>
  </div>

  <!-- Markdown -> HTML (canlı önizleme) -->
  <div id="md-md2html-section" class="md-section active">
    <div class="md-card">
      <div class="md-panes">
        <div class="md-pane">
          <div class="md-pane-head">
            <label>Markdown</label>
            <button id="md-btn-download-md" class="btn btn-outline md-mini-btn">
              <i class="ph ph-download-simple"></i> <span data-i18n="md_download_md">.md İndir</span>
            </button>
          </div>
          <textarea id="md-input" class="md-textarea" spellcheck="false" data-i18n-placeholder="md_input_placeholder"># Başlık

Merhaba **LovoTools**!

- Liste maddesi
- İkinci madde

`kod örneği` ve [bağlantı](https://example.com)</textarea>
        </div>
        <div class="md-pane">
          <div class="md-pane-head">
            <label data-i18n="md_preview_label">Canlı Önizleme</label>
            <div style="display: flex; gap: 0.6rem;">
              <button id="md-btn-copy-html" class="btn btn-outline md-mini-btn">
                <i class="ph ph-copy"></i> <span data-i18n="md_copy_html">HTML Kopyala</span>
              </button>
              <button id="md-btn-download-html" class="btn btn-success md-mini-btn">
                <i class="ph ph-download-simple"></i> <span data-i18n="md_download_html">.html İndir</span>
              </button>
            </div>
          </div>
          <div id="md-preview" class="md-preview"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- HTML -> Markdown -->
  <div id="md-html2md-section" class="md-section">
    <div class="md-card">
      <div class="md-panes">
        <div class="md-pane">
          <div class="md-pane-head">
            <label>HTML</label>
          </div>
          <textarea id="md-html-input" class="md-textarea" spellcheck="false" data-i18n-placeholder="md_html_placeholder"></textarea>
        </div>
        <div class="md-pane">
          <div class="md-pane-head">
            <label>Markdown</label>
            <div style="display: flex; gap: 0.6rem;">
              <button id="md-btn-copy-md" class="btn btn-outline md-mini-btn">
                <i class="ph ph-copy"></i> <span data-i18n="md_copy_md">Kopyala</span>
              </button>
              <button id="md-btn-download-md2" class="btn btn-success md-mini-btn">
                <i class="ph ph-download-simple"></i> <span data-i18n="md_download_md">.md İndir</span>
              </button>
            </div>
          </div>
          <textarea id="md-output" class="md-textarea" readonly></textarea>
        </div>
      </div>
      <div style="text-align: center; margin-top: 1.25rem;">
        <button id="md-btn-html2md" class="btn btn-primary" style="padding: 0.9rem 3rem; border-radius: 12px;">
          <i class="ph ph-arrows-left-right"></i> <span data-i18n="md_convert_btn">Dönüştür</span>
        </button>
      </div>
    </div>
  </div>
</section>
