<section id="data-convert-panel" class="tool-panel">
  <div class="tool-header">
    <div class="tool-breadcrumb" onclick="openDashboard()">
      <i class="ph ph-squares-four"></i> <span data-i18n="breadcrumb_tools">Araçlar</span>
      <i class="ph ph-caret-right"></i> <span data-i18n="dconv_breadcrumb">Geliştirici</span>
    </div>
    <h2 data-i18n="dconv_title">Veri Dönüştürücü (JSON · CSV · Excel)</h2>
  </div>

  <div class="dconv-card">
    <div class="dconv-io-row">
      <div class="dconv-col">
        <div class="dconv-col-head">
          <label data-i18n="dconv_input_label">Girdi:</label>
          <div style="display: flex; gap: 0.6rem; align-items: center;">
            <select id="dconv-source" class="custom-select">
              <option value="json" selected>JSON</option>
              <option value="csv">CSV</option>
            </select>
            <button id="dconv-btn-file" class="btn btn-outline" style="padding: 0.55rem 1rem; font-size: 0.85rem;">
              <i class="ph ph-upload-simple"></i> <span data-i18n="dconv_file_btn">Dosya Yükle</span>
            </button>
            <input type="file" id="dconv-file-input" accept=".json,.csv,.xlsx,.xls,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          </div>
        </div>
        <textarea id="dconv-input" class="dconv-textarea" spellcheck="false" data-i18n-placeholder="dconv_input_placeholder"></textarea>
      </div>

      <div class="dconv-middle">
        <div class="dconv-field">
          <label data-i18n="dconv_target_label">Hedef:</label>
          <select id="dconv-target" class="custom-select" style="width: 100%;">
            <option value="csv" selected>CSV</option>
            <option value="json">JSON</option>
            <option value="xlsx">Excel (.xlsx)</option>
          </select>
        </div>
        <button id="dconv-btn-run" class="btn btn-primary btn-glow" style="width: 100%; padding: 1rem; border-radius: 12px;">
          <i class="ph ph-arrows-left-right"></i> <span data-i18n="dconv_run_btn">Dönüştür</span>
        </button>
        <p class="dconv-note" data-i18n="dconv_note">JSON girdisi nesne dizisi olmalıdır: [{"ad":"...", "yas":1}, ...]</p>
      </div>

      <div class="dconv-col">
        <div class="dconv-col-head">
          <label data-i18n="dconv_output_label">Sonuç:</label>
          <div style="display: flex; gap: 0.6rem;">
            <button id="dconv-btn-copy" class="btn btn-outline" style="padding: 0.55rem 1rem; font-size: 0.85rem;">
              <i class="ph ph-copy"></i> <span data-i18n="dconv_copy_btn">Kopyala</span>
            </button>
            <button id="dconv-btn-download" class="btn btn-success" style="padding: 0.55rem 1rem; font-size: 0.85rem;" disabled>
              <i class="ph ph-download-simple"></i> <span data-i18n="dconv_download_btn">İndir</span>
            </button>
          </div>
        </div>
        <textarea id="dconv-output" class="dconv-textarea" readonly data-i18n-placeholder="dconv_output_placeholder"></textarea>
      </div>
    </div>
    <p id="dconv-status" class="dconv-status"></p>
  </div>
</section>
