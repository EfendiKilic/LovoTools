<section id="shortcut-guide-panel" class="tool-panel">
  <div class="tool-header">
    <div class="tool-breadcrumb" onclick="openDashboard()">
      <i class="ph ph-squares-four"></i> <span data-i18n="breadcrumb_tools">Araçlar</span>
      <i class="ph ph-caret-right"></i> <span data-i18n="sck_breadcrumb">Geliştirici</span>
    </div>
    <h2 data-i18n="sck_title">Kısayol Rehberi</h2>
  </div>

  <section class="editor-zone active">
    <div class="sck-card">
      <div id="sck-pills" class="sck-pills"></div>

      <div class="sck-controls">
        <div class="sck-search-wrap">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" id="sck-search" class="custom-input" data-i18n-placeholder="sck_search_placeholder" placeholder="Kısayol, ad veya açıklama ara...">
        </div>
        <select id="sck-sort" class="custom-select">
          <option value="popular" selected data-i18n="sck_sort_popular">En Çok Kullanılan</option>
          <option value="least" data-i18n="sck_sort_least">En Az Kullanılan</option>
          <option value="az" data-i18n="sck_sort_az">Alfabetik (Ad)</option>
          <option value="key" data-i18n="sck_sort_key">Alfabetik (Tuş)</option>
        </select>
        <span id="sck-count" class="sck-count"></span>
      </div>

      <div id="sck-list" class="sck-list"></div>

      <p class="sck-hint" data-i18n="sck_hint">Bir satıra tıklayarak kısayolu panoya kopyalayabilirsiniz.</p>
    </div>
  </section>
</section>
