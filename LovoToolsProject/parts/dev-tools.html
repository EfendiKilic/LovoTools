<section id="dev-tools-panel" class="tool-panel">
  <div class="tool-header">
    <div class="tool-breadcrumb" onclick="openDashboard()">
      <i class="ph ph-squares-four"></i> <span data-i18n="breadcrumb_tools">Araçlar</span>
      <i class="ph ph-caret-right"></i> <span data-i18n="devt_breadcrumb">Geliştirici</span>
    </div>
    <h2 data-i18n="devt_title">Geliştirici Mini Araçları</h2>
  </div>

  <div class="devt-tabs">
    <button class="devt-tab active" data-tab="base64"><i class="ph ph-brackets-angle"></i> Base64</button>
    <button class="devt-tab" data-tab="url"><i class="ph ph-link"></i> URL Encode</button>
    <button class="devt-tab" data-tab="uuid"><i class="ph ph-fingerprint"></i> UUID</button>
    <button class="devt-tab" data-tab="hash"><i class="ph ph-hash"></i> Hash</button>
    <button class="devt-tab" data-tab="password"><i class="ph ph-password"></i> <span data-i18n="devt_tab_password">Şifre Üretici</span></button>
  </div>

  <!-- Base64 -->
  <div class="devt-section active" data-section="base64">
    <div class="devt-card">
      <label data-i18n="devt_input_label">Girdi:</label>
      <textarea id="devt-b64-input" class="devt-textarea" data-i18n-placeholder="devt_b64_placeholder"></textarea>
      <div class="devt-btn-row">
        <button id="devt-b64-encode" class="btn btn-primary"><i class="ph ph-arrow-down"></i> Encode</button>
        <button id="devt-b64-decode" class="btn btn-outline"><i class="ph ph-arrow-up"></i> Decode</button>
      </div>
      <label data-i18n="devt_output_label">Sonuç:</label>
      <textarea id="devt-b64-output" class="devt-textarea" readonly></textarea>
      <button class="btn btn-success devt-copy-btn" data-copy-target="devt-b64-output"><i class="ph ph-copy"></i> <span data-i18n="devt_copy">Kopyala</span></button>
    </div>
  </div>

  <!-- URL Encode -->
  <div class="devt-section" data-section="url">
    <div class="devt-card">
      <label data-i18n="devt_input_label">Girdi:</label>
      <textarea id="devt-url-input" class="devt-textarea" data-i18n-placeholder="devt_url_placeholder"></textarea>
      <div class="devt-btn-row">
        <button id="devt-url-encode" class="btn btn-primary"><i class="ph ph-arrow-down"></i> Encode</button>
        <button id="devt-url-decode" class="btn btn-outline"><i class="ph ph-arrow-up"></i> Decode</button>
      </div>
      <label data-i18n="devt_output_label">Sonuç:</label>
      <textarea id="devt-url-output" class="devt-textarea" readonly></textarea>
      <button class="btn btn-success devt-copy-btn" data-copy-target="devt-url-output"><i class="ph ph-copy"></i> <span data-i18n="devt_copy">Kopyala</span></button>
    </div>
  </div>

  <!-- UUID -->
  <div class="devt-section" data-section="uuid">
    <div class="devt-card">
      <div class="devt-inline-row">
        <div>
          <label data-i18n="devt_uuid_count">Adet:</label>
          <select id="devt-uuid-count" class="custom-select">
            <option value="1" selected>1</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="25">25</option>
          </select>
        </div>
        <button id="devt-uuid-generate" class="btn btn-primary" style="align-self: flex-end;">
          <i class="ph ph-arrows-clockwise"></i> <span data-i18n="devt_generate">Üret</span>
        </button>
      </div>
      <label data-i18n="devt_output_label">Sonuç:</label>
      <textarea id="devt-uuid-output" class="devt-textarea" readonly style="font-family: monospace;"></textarea>
      <button class="btn btn-success devt-copy-btn" data-copy-target="devt-uuid-output"><i class="ph ph-copy"></i> <span data-i18n="devt_copy">Kopyala</span></button>
    </div>
  </div>

  <!-- Hash -->
  <div class="devt-section" data-section="hash">
    <div class="devt-card">
      <label data-i18n="devt_input_label">Girdi:</label>
      <textarea id="devt-hash-input" class="devt-textarea" data-i18n-placeholder="devt_hash_placeholder"></textarea>
      <div class="devt-inline-row">
        <div>
          <label data-i18n="devt_hash_algo">Algoritma:</label>
          <select id="devt-hash-algo" class="custom-select">
            <option value="SHA-256" selected>SHA-256</option>
            <option value="SHA-1">SHA-1</option>
            <option value="SHA-384">SHA-384</option>
            <option value="SHA-512">SHA-512</option>
          </select>
        </div>
        <button id="devt-hash-generate" class="btn btn-primary" style="align-self: flex-end;">
          <i class="ph ph-hash"></i> <span data-i18n="devt_hash_btn">Hash Hesapla</span>
        </button>
      </div>
      <label data-i18n="devt_output_label">Sonuç:</label>
      <textarea id="devt-hash-output" class="devt-textarea" readonly style="font-family: monospace; height: 80px;"></textarea>
      <button class="btn btn-success devt-copy-btn" data-copy-target="devt-hash-output"><i class="ph ph-copy"></i> <span data-i18n="devt_copy">Kopyala</span></button>
    </div>
  </div>

  <!-- Password -->
  <div class="devt-section" data-section="password">
    <div class="devt-card">
      <div class="devt-inline-row" style="align-items: center;">
        <div style="flex: 1;">
          <label><span data-i18n="devt_pw_length">Uzunluk:</span> <strong id="devt-pw-length-value">16</strong></label>
          <input type="range" id="devt-pw-length" min="8" max="64" value="16" style="width: 100%;">
        </div>
      </div>
      <div class="devt-checks">
        <label><input type="checkbox" id="devt-pw-upper" checked> ABC</label>
        <label><input type="checkbox" id="devt-pw-lower" checked> abc</label>
        <label><input type="checkbox" id="devt-pw-digits" checked> 123</label>
        <label><input type="checkbox" id="devt-pw-symbols" checked> #$&</label>
      </div>
      <button id="devt-pw-generate" class="btn btn-primary" style="width: 100%;">
        <i class="ph ph-arrows-clockwise"></i> <span data-i18n="devt_pw_btn">Şifre Üret</span>
      </button>
      <label data-i18n="devt_output_label" style="margin-top: 1rem;">Sonuç:</label>
      <input type="text" id="devt-pw-output" class="custom-input" readonly style="width: 100%; font-family: monospace; font-size: 1.15rem; text-align: center;">
      <button class="btn btn-success devt-copy-btn" data-copy-target="devt-pw-output"><i class="ph ph-copy"></i> <span data-i18n="devt_copy">Kopyala</span></button>
    </div>
  </div>
</section>
