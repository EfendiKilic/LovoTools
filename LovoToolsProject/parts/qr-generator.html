<section id="qr-generator-panel" class="tool-panel">
  <div class="tool-header">
    <div class="tool-breadcrumb" onclick="openDashboard()">
      <i class="ph ph-squares-four"></i> <span data-i18n="breadcrumb_tools">Araçlar</span>
      <i class="ph ph-caret-right"></i> <span data-i18n="qr_breadcrumb">Geliştirici</span>
    </div>
    <h2 data-i18n="qr_title">QR Kod Oluşturucu</h2>
  </div>

  <div class="qr-tabs" style="display: flex; gap: 0.75rem; margin: 0 auto 2rem; max-width: 1100px;">
    <button id="qr-tab-generate" class="qr-tab active">
      <i class="ph ph-qr-code"></i> <span data-i18n="qr_tab_generate">Oluşturucu</span>
    </button>
    <button id="qr-tab-read" class="qr-tab">
      <i class="ph ph-scan"></i> <span data-i18n="qr_tab_read">Okuyucu</span>
    </button>
  </div>

  <!-- QR Okuyucu -->
  <div id="qr-read-section" class="qr-section" style="max-width: 1100px; margin: 0 auto;">
    <div style="background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-strong); border-radius: 24px; padding: 2.5rem; box-shadow: var(--shadow-ring);">
      <div class="upload-card" onclick="document.getElementById('qr-read-input').click()" style="cursor: pointer;">
        <div class="icon-circle"><i class="ph ph-scan"></i></div>
        <h3 data-i18n="qr_read_upload_title">QR kod içeren görseli yükleyin</h3>
        <p data-i18n="common_upload_drag">Sürükleyip bırakın veya seçmek için tıklayın.</p>
        <small data-i18n="qr_read_note">(Ekran görüntüsü, fotoğraf — tamamen tarayıcıda çözülür)</small>
        <input type="file" id="qr-read-input" accept="image/*" hidden>
      </div>

      <div id="qr-read-result" class="hidden" style="margin-top: 2rem; padding: 1.5rem; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 16px; animation: fadeIn 0.4s ease;">
        <label style="display: block; margin-bottom: 0.75rem; font-weight: 600; font-size: 0.9rem; color: var(--text-muted);" data-i18n="qr_read_result_label">Çözülen İçerik:</label>
        <textarea id="qr-read-output" readonly style="width: 100%; height: 100px; resize: vertical; background: var(--bg-elevated); border: 1px solid var(--border-light); color: var(--text-main); padding: 1rem; border-radius: 12px; font-size: 0.95rem; outline: none;"></textarea>
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap;">
          <button id="qr-read-copy" class="btn btn-success" style="padding: 0.75rem 1.5rem; border-radius: 10px;">
            <i class="ph ph-copy"></i> <span data-i18n="qr_read_copy">Kopyala</span>
          </button>
          <a id="qr-read-open" class="btn btn-outline hidden" target="_blank" rel="noopener noreferrer" style="padding: 0.75rem 1.5rem; border-radius: 10px; text-decoration: none;">
            <i class="ph ph-arrow-square-out"></i> <span data-i18n="qr_read_open">Bağlantıyı Aç</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="qr-generate-section" class="qr-section active editor-main-container" style="background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-strong); border-radius: 24px; padding: 4rem; box-shadow: var(--shadow-ring); display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; max-width: 1100px; margin: 0 auto;">
    <!-- Controls (Left) -->
    <div class="qr-controls">
      <div class="input-group" style="margin-bottom: 2rem;">
        <label style="display: block; margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem; color: var(--text-main);" data-i18n="qr_content_label">QR Kod İçeriği:</label>
        <textarea id="qr-url-input" class="custom-input" style="width: 100%; height: 140px; resize: none; font-size: 1.1rem; padding: 1.5rem; border-radius: 16px;" data-i18n-placeholder="qr_input_placeholder"></textarea>
      </div>

      <div class="qr-options-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 2rem;">
        <div class="input-group">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: var(--text-muted);" data-i18n="qr_color_dark">Kod Rengi:</label>
          <input type="color" id="qr-color-dark" value="#000000" style="width: 100%; height: 44px; border: 1px solid var(--border-light); border-radius: 10px; background: var(--bg-card); cursor: pointer; padding: 4px;">
        </div>
        <div class="input-group">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: var(--text-muted);" data-i18n="qr_color_light">Arka Plan:</label>
          <input type="color" id="qr-color-light" value="#ffffff" style="width: 100%; height: 44px; border: 1px solid var(--border-light); border-radius: 10px; background: var(--bg-card); cursor: pointer; padding: 4px;">
        </div>
      </div>

      <button id="btn-generate-qr" class="btn btn-primary" style="width: 100%; padding: 1.25rem; font-size: 1.1rem; border-radius: 14px; box-shadow: var(--shadow-md);">
        <i class="ph ph-qr-code"></i> <span data-i18n="qr_generate_btn">QR Kod Oluştur</span>
      </button>

      <div id="qr-result-box" class="hidden" style="margin-top: 2.5rem; animation: fadeIn 0.4s ease;">
        <div class="input-group" style="margin-bottom: 1.5rem;">
           <label style="display: block; margin-bottom: 0.75rem; font-weight: 600; font-size: 0.9rem; color: var(--text-muted);" data-i18n="qr_filename_label">Dosya Adı (Opsiyonel):</label>
           <input type="text" id="qr-filename-input" class="custom-input" style="width: 100%; border-radius: 12px;" data-i18n-placeholder="qr_filename_placeholder">
        </div>
        <div class="qr-options-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
          <div class="input-group">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: var(--text-muted);" data-i18n="qr_format_label">Format:</label>
            <select id="qr-format-select" class="custom-select" style="width: 100%; border-radius: 10px;">
              <option value="png" selected>PNG</option>
              <option value="jpg">JPG</option>
              <option value="webp">WebP</option>
              <option value="svg">SVG (Vektör)</option>
            </select>
          </div>
          <div class="input-group">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: var(--text-muted);" data-i18n="qr_size_label">Boyut:</label>
            <select id="qr-size-select" class="custom-select" style="width: 100%; border-radius: 10px;">
              <option value="256">256 px</option>
              <option value="512" selected>512 px</option>
              <option value="1024">1024 px</option>
              <option value="2048">2048 px</option>
            </select>
          </div>
        </div>
        <button id="btn-download-qr" class="btn btn-success" style="width: 100%; padding: 1rem; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
          <i class="ph ph-download-simple"></i> <span data-i18n="qr_download_btn">QR Kodu İndir</span>
        </button>
      </div>
    </div>

    <!-- Preview (Right) -->
    <div class="qr-preview-side" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-subtle); border-radius: 32px; padding: 3rem; border: 2px dashed var(--border-strong); min-height: 400px;">
      <div id="qr-container" style="background: var(--bg-card); padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow-lg); transition: transform 0.3s ease;">
         <div style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; color: #cbd5e1;">
            <i class="ph ph-image-square" style="font-size: 4rem;"></i>
         </div>
      </div>
      <p id="qr-hint" style="font-size: 0.95rem; color: var(--text-muted); text-align: center; margin-top: 2rem; max-width: 250px; line-height: 1.5;" data-i18n="qr_hint">
        İçeriği girin ve ardından oluştur butonuna basın.
      </p>
    </div>
  </div>
</section>

<style>
  .hidden { display: none !important; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .qr-tab {
    flex: 1;
    max-width: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 1rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .qr-tab i { font-size: 1.3rem; }
  .qr-tab:hover { border-color: var(--primary); color: var(--primary); }
  .qr-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: var(--shadow-md); }

  .qr-section { display: none; }
  .qr-section.active { display: block; }
  #qr-generate-section.active { display: grid; }
</style>
